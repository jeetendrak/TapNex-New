<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TapNex — Redirecting to Smart Profile</title>
    <script>
      (function () {
        var target = window.location.pathname + window.location.search + window.location.hash;
        try {
          sessionStorage.setItem('tapnex_spa_redirect', target);
        } catch (e) {}
        window.location.replace('/?spa_redirect=' + encodeURIComponent(target));
      })();
    </script>
  </head>
  <body></body>
</html>
